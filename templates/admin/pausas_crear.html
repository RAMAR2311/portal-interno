{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-3">
        <div class="col-md-12 d-flex justify-content-between align-items-center">
            <h3><i class="fas fa-plus-circle text-warning"></i> Crear Pausa Activa</h3>
            <a href="{{ url_for('admin.pausas_asignar') }}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Volver a Asignaciones
            </a>
        </div>
    </div>
    
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form action="{{ url_for('admin.pausas_crear') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Título de la Pausa</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Ej: Estiramiento de Cuello" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción / Instrucciones</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Instrucciones detalladas de los ejercicios..." required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">URL de Video (YouTube) - Opcional</label>
                    <input type="url" name="url_video" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
                    <small class="text-muted">Si se incluye, se mostrará embebido en el modal de los empleados.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Duración Mínima (Minutos)</label>
                    <input type="number" name="duracion_minutos" class="form-control" value="5" min="1" max="60" required>
                </div>
                
                <button type="submit" class="btn btn-warning w-100">
                    <i class="fas fa-save"></i> Guardar Pausa Activa
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
