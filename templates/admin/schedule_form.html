{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-clock me-2"></i>Asignar Horario: {{ empleado.nombre }}</h4>
                <a href="{{ url_for('admin.horarios_lista') }}" class="btn btn-outline-light btn-sm">Volver</a>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light text-center">
                                <tr>
                                    <th>Día</th>
                                    <th>¿Laboral?</th>
                                    <th>Hora Entrada</th>
                                    <th>Hora Salida</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for d in horario %}
                                <tr class="{{ 'table-info' if d.es_laboral else 'table-light text-muted' }}">
                                    <td class="fw-bold">{{ d.dia }}</td>
                                    <td class="text-center">
                                        <div class="form-check form-switch d-inline-block">
                                            <input class="form-check-input" type="checkbox" name="laboral_{{ d.index }}" 
                                                   id="laboral_{{ d.index }}" {% if d.es_laboral %}checked{% endif %}>
                                        </div>
                                    </td>
                                    <td>
                                        <input type="time" name="entrada_{{ d.index }}" class="form-control form-control-sm" 
                                               value="{{ d.entrada }}" {% if not d.es_laboral %}disabled{% endif %}>
                                    </td>
                                    <td>
                                        <input type="time" name="salida_{{ d.index }}" class="form-control form-control-sm" 
                                               value="{{ d.salida }}" {% if not d.es_laboral %}disabled{% endif %}>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-success px-5">
                            <i class="fas fa-save me-2"></i>Guardar Horario
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.querySelectorAll('.form-check-input').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const row = this.closest('tr');
            const inputs = row.querySelectorAll('input[type="time"]');
            if (this.checked) {
                row.classList.remove('table-light', 'text-muted');
                row.classList.add('table-info');
                inputs.forEach(i => i.disabled = false);
            } else {
                row.classList.remove('table-info');
                row.classList.add('table-light', 'text-muted');
                inputs.forEach(i => {
                    i.disabled = true;
                    i.value = '';
                });
            }
        });
    });
</script>
{% endblock %}
